name: Report a persona gap
description: A participant type the toolkit does not represent
labels: [persona, inclusion, triage]
body:
  - type: textarea
    id: who
    attributes:
      label: Who is missing?
      description: Be specific. "A new member in a jurisdiction with weak rule of law" is more useful than "a new member".
    validations: {required: true}
  - type: dropdown
    id: type
    attributes:
      label: Persona type
      options: [legitimate_user, machine_agent, bad_actor, edge_case]
    validations: {required: true}
  - type: textarea
    id: pathway
    attributes:
      label: Why is their participation pathway harder than the mainstream case?
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or fieldwork this is grounded in
      description: Personas grounded in nothing produce risks calibrated to nothing.
