# RAHP instance declaration.
#
# This file is what makes the repository an *instance* of the RAHP method rather
# than the method itself. Everything under method/ is portable; everything under
# data/ is DTG-specific and is what another working group would replace.
#
# To adopt RAHP for a different specification: fork, keep method/ and tools/,
# empty data/ except this file, and start at lifecycle stage STAGE-1.

instance:
  id: dtg
  name: Decentralised Trust Graph — Credentials Task Force
  working_group: DTG Working Group (DTGWG)
  host: Trust over IP Foundation / Linux Foundation Decentralized Trust
  target_specification:
    name: DTG Credential Specification
    version_assessed: v0.3
    review_date: 2026-03
    repository: https://github.com/trustoverip/dtgwg-cred-spec
  toolkit_version: v0.3-dev
  source_artefacts:
    user_stories_framework: DTG_RAHP_User_Stories_Framework_v6.xlsx
    risk_register: DTG_RAHP_Risk_Register_v5.xlsx
    personas: DTG RAHP - Personas.docx, DTG_RAHP_Personas_Edge_Cases.docx
  licence: CC-BY-4.0
  maintainer: Risk Assessment & Harms Prevention Task Force, DTGWG

# Identifier namespaces used by this instance. The validator enforces that every
# record ID matches its namespace pattern and that no ID is defined twice.
namespaces:
  RK:      {pattern: '^RK-[A-Z]{1,2}\d{2}$', record_type: risk,                file: risks.yaml}
  CT:      {pattern: '^CT-\d{2}$',           record_type: control,             file: controls.yaml}
  GR:      {pattern: '^GR-\d{2}$',           record_type: guardrail,           file: guardrails.yaml}
  AT:      {pattern: '^AT-\d{2}$',           record_type: assurance_test,      file: assurance-tests.yaml}
  M:       {pattern: '^M-\d{2}$',            record_type: metric,              file: metrics.yaml}
  US:      {pattern: '^US-\d{2}$',           record_type: user_story,          file: user-stories.yaml}
  SC:      {pattern: '^SC-\d{2}$',           record_type: scenario,            file: scenarios.yaml}
  EPIC:    {pattern: '^EPIC-\d{1,2}$',       record_type: epic,                file: epics.yaml}
  PERSONA: {pattern: '^(D[1-6]|M[12]|B[123]|EC[1-4][ab]?)$', record_type: persona, file: personas.yaml}
  REC:     {pattern: '^REC-\d+$',            record_type: recommendation,      file: recommendations.yaml}
  RA:      {pattern: '^RA-\d{3}$',           record_type: risk_acceptance,     file: risk-acceptances.yaml}
  GP:      {pattern: '^GP-\d{3}$',           record_type: governance_precedent, file: governance-precedents.yaml}

# Cross-reference edges the validator checks. Each entry says: in this record
# type, this field must contain identifiers that resolve in this namespace.
references:
  risk:               {affected_metrics: M, user_stories: US, scenarios: SC, guardrails: GR, controls: CT, assurance_tests: AT, epics: EPIC}
  control:            {guardrails: GR, linked_risks: RK}
  guardrail:          {risks_addressed: RK, controls: CT, assurance_tests: AT}
  assurance_test:     {guardrail: GR, risks_covered: RK}
  metric:             {risks_measured: RK, user_stories: US, scenarios: SC, epics: EPIC, personas_want_high: PERSONA, personas_want_suppressed: PERSONA}
  user_story:         {persona: PERSONA, scenarios: SC, epics: EPIC, metrics: M}
  scenario:           {user_stories: US, metrics: M, legitimate_personas: PERSONA, adversarial_personas: PERSONA}
  epic:               {personas: PERSONA, user_stories: US, metrics: M}
  recommendation:     {linked_guardrails: GR, linked_controls: CT, linked_risks: RK}
  risk_acceptance:    {risk_id: RK}
  governance_precedent: {linked_risks: RK, linked_controls: CT, linked_guardrails: GR}

# Invariants that express the method's own rules (see method/lifecycle.yaml,
# STAGE-2). These are the checks that make the toolkit self-enforcing.
invariants:
  - id: INV-1
    rule: every_guardrail_has_assurance_test
    message: A guardrail without an assurance test is unverifiable.
    severity: error
  - id: INV-2
    rule: every_control_reaches_a_metric
    message: >-
      A control without a metric linkage is unmonitorable. Satisfied transitively — a control
      counts as monitorable if any risk it is linked to has at least one affected metric.
    severity: error
  - id: INV-3
    rule: critical_risk_has_guardrail
    message: A Critical-severity risk must be gated by at least one guardrail; it may not be risk-accepted.
    severity: error
  - id: INV-4
    rule: must_address_risk_is_covered
    message: >-
      A risk marked must_address needs either a guardrail or a risk acceptance record.
    severity: warning
  - id: INV-5
    rule: no_orphan_identifiers
    message: Every defined identifier should be referenced by at least one other record.
    severity: warning
