- id: RK-SC03
  name: VRC Over-Disclosure — Rich Data in Core Edge
  category: Schemas
  lifecycle_phase: All phases
  description: The VRC schema (spec §5.2) requires only the target DID and proof, but places no constraint
    on what additional data may be embedded in `credentialSubject`. Implementers who embed rich relationship
    metadata — relationship duration, first-meeting location, mutual endorsements — directly in VRCs rather
    than using the annotation credential layer (VPC, VEC, VWC) create credentials in which both parties
    have cryptographically committed to that data. It cannot then be selectively disclosed or withheld
    from verifiers. The annotation credential architecture exists in the spec but is not normatively required
    as the channel for supplementary data. **Introduced by:** DTG Credential Spec v0.3 analysis (RAHP
    commentary §2.4).
  harm_types:
  - Privacy
  - Data Protection
  severity: Medium
  likelihood: Medium
  harm_description: Members inadvertently commit to more personal data than intended in bilateral VRCs;
    ZKP selective disclosure is undermined because the data is in the core credential, not an annotation;
    relationship graphs become richer surveillance targets than necessary.
  affected_metrics:
  - M-09
