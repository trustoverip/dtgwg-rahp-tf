- id: RK-EX05
  name: Organisational Identity Architecture Gap
  category: External
  lifecycle_phase: Phase 1–4 / Ongoing
  description: The DTG Credential Specification v0.3 defines credential schemas for individual natural
    persons. An NHS Foundation Trust (EC3) or other regulated organisation seeking to participate as a
    VTC member holds institutional identity, makes decisions through board governance rather than individual
    consent, and has complex internal authority chains (Caldicott Guardian, CDO, board resolution) that
    cannot be represented in the current C-DID model. Regulatory compliance (NHS DSPT, DCB3051, CQC) requires
    the organisation's governance to be traceable to its credential operations in ways the current architecture
    does not support. The DTG spec has no organisational credential type.
  harm_types:
  - Governance Failure
  - Regulatory Breach
  severity: High
  likelihood: High
  harm_description: Regulated organisations cannot participate in the DTG ecosystem in a compliant way.
    NHS Trusts cannot issue VMCs interoperable with the NHS Digital Staff Passport. The absence of an
    organisational identity model means the DTG ecosystem remains limited to individual participants,
    excluding the institutional sector that would drive adoption at scale. Organisations that attempt
    to participate using workarounds (an individual holding a C-DID on behalf of an institution) create
    unrecognised personal liability and governance gaps.
