  category: External
  lifecycle_phase: Phase 4 / Age-Restricted Use Cases
  description: An age-restricted relying party (EC4) relies on IDVCs issued by IDVPs registered in the
    VTC trust registry. Where subscribers are located internationally, their IDVCs may have been issued
    by IDVPs whose trust registry standing is uncertain, whose jurisdiction's age verification standards
    differ from UK Ofcom requirements, or who have subsequently been deregistered or compromised (cf.
    RK-ID03, AU10TIX breach 2024). The relying party cannot independently verify the current standing
    of a foreign IDVP in near-real-time without a cross-jurisdiction trust registry resolution mechanism.
    The Online Safety Act 2023 does not provide a safe harbour for good-faith reliance on a deregistered
    IDVP.
  harm_types:
  - Regulatory Breach
  - Liability
  severity: High
  likelihood: Medium
  harm_description: A relying party accepts an IDVC from a subscriber whose IDVP has been deregistered
    or was never compliant with UK Ofcom standards. Ofcom finds the age assurance technically inadequate
    regardless of the relying party's good faith. The relying party faces enforcement action. The DTG
    trust registry does not have a defined mechanism for propagating IDVP deregistration to relying parties
    in near-real-time across jurisdictions. The broader IDVP ecosystem loses confidence in the DTG trust
    registry as a reliable source of IDVP standing.
