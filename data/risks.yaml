- id: RK-ID06
  name: Minor Data Exposure via Co-Signatory Inference
  category: Identity
  lifecycle_phase: Phase 3–4
  description: 'When a minor (or person lacking full independent capacity) applies to join a VTC, any
    co-signatory structure in the admission credential implicitly signals that the credential holder has
    reduced or delegated capacity. This disclosure is not consented to: the minor''s SEN status, age,
    or disability is inferred from the governance structure itself, even if no explicit SEN attribute
    is included in the credential. The UK Online Safety Act 2023 and the Data (Use and Access) Act 2025
    impose additional obligations on systems processing children''s data, which a VTC admitting under-18s
    becomes subject to — often without realising it.'
  harm_types:
  - Privacy Harm
  - Regulatory Breach
  severity: High
  likelihood: High
  harm_description: A minor's SEN profile, disability status, or reduced capacity is disclosed without
    their consent to any party that can observe the credential structure. This constitutes processing
    of special-category data under UK GDPR without a lawful basis. The VTC governing body becomes subject
    to Online Safety Act 2023 children's data obligations without necessarily having the governance structures
    to comply. Failure to protect this inferred data creates regulatory exposure and reputational harm
