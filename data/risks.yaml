  category: External
  lifecycle_phase: Phase 4 / Age-Restricted Use Cases
  description: 'A minor successfully obtains or presents a valid-appearing over-18 IDVC, whether through
    IDVP failure, synthetic credential generation by Phantom (M2) or Viktor (B1), a ZKP implementation
    gap (RK-CY01), or an architecture flaw in the age assurance pathway. This is a non-negotiable child
    safety failure with criminal liability implications under the Online Safety Act 2023 for any age-restricted
    relying party (e.g., EC4 Velvet Gate). Unlike other register risks, this risk has a binary outcome:
    any non-zero incident rate is a system-level failure. The Ofcom regime provides no safe harbour for
    technical failure where the architecture was knowingly immature.'
