- id: RK-HX06
  name: Credential Lifecycle Abandonment on Capacity Loss or Death
  category: Human Experience
  lifecycle_phase: Revocation / Ongoing
  description: When a member loses capacity progressively (e.g., dementia) or dies, the DTG architecture
    has no defined lifecycle event for credential closure, dormancy, or attorney-mediated continuation.
    The M-DID simply goes silent. There is no mechanism for the trust graph to record a capacity transition,
    for credentials to enter an attorney-managed state, or for a death notification to propagate to relying
    parties. The spec addresses revocation but not the end of life as a credential lifecycle event.
  harm_types:
  - Governance Failure
  - Privacy Harm
  severity: Medium
  likelihood: High
  harm_description: 'Ghost nodes accumulate in the trust graph: members who have lost capacity or died
    appear as active participants. Trust graph topology calculations (anchor diversity, reciprocity rates)
    are distorted by stale nodes. Relying parties may accept credentials from a deceased member''s DID.
    Family members or attorneys have no recognised pathway to close the account, creating distress and
    potential identity misuse risk. The absence of a death-closure pathway also means a malicious actor
    could continue operating a deceased member''s DID without detection.'
  affected_metrics:
