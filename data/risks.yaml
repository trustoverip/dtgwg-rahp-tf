- id: RK-G05
  name: Governanceless VTC Claiming Credential Compliance
  category: Governance
  lifecycle_phase: Phase 1
  description: The DTG Credential Specification v0.3 defines credential schemas (§2–§8) and normative
    credential requirements without requiring that a VTC deploying these credentials has any governance
    framework in place. A developer group could deploy technically compliant VMCs and VRCs — passing all
    credential-layer verification checks — while operating with no genesis policy, no time-bounded initiator
    authority, and no trust anchor diversity requirements. Relying parties would have no normative signal
    that governance is absent. **Introduced by:** DTG Credential Spec v0.3 analysis — gap identified in
    §9 (Trust Registries section) and commentary §2.9.
