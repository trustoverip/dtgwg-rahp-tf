- id: RK-SC04
  name: M-DID Bootstrapping Exception Undermines R-DID Privacy
  category: Schemas
  lifecycle_phase: Phase 1–3
  description: Spec §5.2 permits M-DIDs 'for bootstrapping' with no normative migration trigger or timeline.
    The Privacy Considerations section (§9) recommends migration to R-DIDs post-bootstrapping but does
    not make this a normative requirement. In practice, if migration never happens — the likely outcome
    without a phase-gate — early VRC relationships remain M-DID-based. An adversary monitoring the trust
    registry during the bootstrapping phase can reconstruct membership graphs from M-DID co-occurrences
    in VRCs issued before migration. **Introduced by:** DTG Credential Spec v0.3 §5.2 and Privacy Considerations
    §9 (RAHP commentary §2.5).
  harm_types:
  - Privacy
  - Governance Failure
  severity: Medium
  likelihood: High
  harm_description: The R-DID architecture's privacy guarantee is contingent on migration actually happening.
    Without a normative trigger, the bootstrapping exception becomes the permanent operating mode for
    many implementations. State actors and registry observers can reconstruct trust graphs from the pre-migration
    VRC corpus.
  affected_metrics:
