- id: RK-HX05
  name: Legal Capacity Architecture Gap — LPA / Guardianship Not Representable
  category: Human Experience
  lifecycle_phase: Phase 3–4 / Revocation / Ongoing
  description: A registered Lasting Power of Attorney (or equivalent legal guardianship instrument) has
    no representation in the DTG credential architecture. The VTC system cannot distinguish a legitimate
    LPA holder authenticating on behalf of a donor from an account takeover. Governance communications
    (revocation notices, renewal reminders, appeals deadlines) are addressed to the credential holder's
    contact details — which an incapacitated person cannot access — with no secondary recipient mechanism.
    The LPA holder has no audit-trail separate from the donor, and no defined pathway to close an M-DID
    on the donor's death.
  harm_types:
  - Governance Failure
  - Legal Harm
  severity: High
  likelihood: Medium
  harm_description: A person who has lost capacity loses their VTC membership by default because no one
    can operate their credentials lawfully. Legitimate LPA holders are treated as unauthorised actors.
    Revocation due process rights (GR-08) are forfeited because notices reach an inaccessible account.
    The governing body cannot involve the LPA holder in governance processes. On death, the M-DID is abandoned
    rather than formally closed, leaving a ghost node in the trust graph and no tamper-evident record
    of the credential lifecycle end.
  affected_metrics:
