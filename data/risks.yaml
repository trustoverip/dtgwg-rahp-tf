- id: RK-CR04
  name: Endorsement Credential (VEC) Manipulation
  category: Credentials
  lifecycle_phase: Phase 3–4 / Ongoing
  description: Spec §7.2 defines the VEC's `endorsement` field as 'community/VTN-defined — structure and
    fields determined by community policy.' This maximum flexibility, with no normative constraint requiring
    endorsers to be co-members of the same VTC as the endorsed party, creates a reputation manipulation
    attack surface. A coordinated bad-faith actor can issue large volumes of fabricated VECs with high
    `competencyLevel` claims to inflate the reputation of synthetic personas, then use those reputational
    signals to gain governance influence. **Introduced by:** DTG Credential Spec v0.3 §7.2 (RAHP commentary
    §2.8).
  harm_types:
  - Governance Failure
  - Identity Fraud
  severity: Medium
  likelihood: Medium
  harm_description: Synthetic personas receive artificially inflated reputation scores via coordinated
    VEC issuance; governance decisions influenced by reputational signals that are manufactured rather
