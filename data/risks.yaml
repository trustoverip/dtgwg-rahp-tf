- id: RK-SC05
  name: Credential Schema Gap — Supported Consent and LPA Not Representable
  category: Schemas
  lifecycle_phase: Phase 3–4 / Ongoing
  description: 'The current VRC, VMC, and IDVC schemas assume a single credential holder who is the same
    legal person as the consent-giver, the DID controller, and the community participant. The schemas
    have no field or structure for: (a) co-signed admission where the signatory is not a substituted decision-maker;
    (b) a delegation credential representing a registered LPA; (c) a capacity-status flag indicating that
    the holder currently operates under supported or substituted decision-making; or (d) a secondary notification
    recipient registered in the trust registry. These gaps mean the architecture literally cannot represent
    legal relationships that exist in the real world for an estimated 1.3 million people in England and
    Wales alone (LPA registrations as of 2025).'
  harm_types:
  - Governance Failure
  - Exclusion
  severity: High
  likelihood: High
  harm_description: The credential architecture cannot serve a large class of legitimate participants
    without introducing impersonation-equivalent workarounds. Any attempt to accommodate these users without
    schema changes creates governance ambiguity, audit trail corruption (Margaret's actions appear as
    Arthur's), and potential violations of the Mental Capacity Act 2005 (which requires clear records
    of attorney decision-making). Standards bodies that adopt the DTG spec without addressing this gap
    will produce a credential ecosystem that is legally non-compliant in the UK, EU, and any jurisdiction
    with equivalent incapacity law.
