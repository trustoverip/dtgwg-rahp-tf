    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-46
  name: Coordinated Behaviour Detection in Governance
  type: Technical
  description: The complaints and appeals workflow must include coordinated behaviour detection, identifying
    statistically anomalous submission patterns (timing, content similarity, source clustering) that indicate
    organised bad-faith campaigns.
  guardrails:
  - GR-15
  linked_risks:
  - RK-SY02
  standards_relevance: Medium
  standards_status: unassigned
  normative_language: null
  rationale: null
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-47
  name: Formal Open Issues Mitigation Plan
  type: Governance
  description: Each of the four VTC Bootstrapping Draft open issues must have a formal mitigation plan
    with owner, target resolution date, and interim risk controls, signed by the governing body before
    Phase 4.
  guardrails:
  - GR-17
  linked_risks:
  - RK-SY03
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: null
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-48
  name: Threat Model Maintenance
  type: Governance
  description: 'A formal VTC threat model must be published, reviewed, and updated at least annually.
    It must cover at minimum: Sybil attacks, state coercion, anchor collusion, AI-mediated attacks, registry
    manipulation, and CIB in governance.'
  guardrails:
  - GR-16
  linked_risks:
  - RK-SY03
  - RK-CY02
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: null
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-49
  name: VRC Data Minimisation Clause
  type: Technical
  description: 'The VRC `credentialSubject` SHOULD contain only the minimum claims necessary for graph
    structure: the target party''s DID and the `validFrom` timestamp. Additional relationship metadata
    (skills, event context, endorsements) SHOULD be expressed through annotation credentials (VPC, VEC,
    VWC per spec §7) rather than embedded in the VRC itself. Implementations MUST NOT require VRC subjects
    to include personal data beyond that strictly required by VTC admission policy. **Source:** DTG Credential
    Spec v0.3 commentary recommendation R6 (§2.4).'
  guardrails:
  - GR-06
  linked_risks:
  - RK-SC03
  - RK-HX01
  - RK-ID05
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: null
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-50
  name: M-DID to R-DID Migration Trigger
  type: Governance
  description: VTC implementations MUST define and publish a normative trigger for migration from M-DID-based
    to R-DID-based VRC edges, as required by spec §5.2 privacy intent. The trigger SHOULD occur before
    Phase 4 opens or before the VTC exceeds a governance-defined membership threshold. After the trigger,
    new VRCs MUST use R-DIDs. The migration trigger condition and date MUST be recorded in the trust registry.
    **Source:** DTG Credential Spec v0.3 §5.2 Privacy Considerations and commentary recommendation R7
    (§2.5).
  guardrails:
  - GR-18
  linked_risks:
  - RK-SC04
  - RK-ID05
  - RK-HX01
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: null
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-51
  name: Non-Human DID Designation in DID Document
  type: Technical
  description: Agent DIDs MUST be designated as non-human in the DID Document using a defined service
    type property or a `@type` assertion, enabling VTAs to apply agent-specific policy. VTAs MAY reject
    VMC applications from DIDs not carrying a human attestation where VTC policy requires proof of personhood.
    This creates a normative distinction between Aether (M1) and Phantom (M2) at the DID layer. **Source:**
    DTG Credential Spec v0.3 analysis — gap in §5.1/§5.2 (commentary §2.3, recommendation R1, §10.1).
  guardrails:
  - GR-12
  linked_risks:
  - RK-AI01
  - RK-AI03
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: null
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-52
  name: Agent Delegation Credential Requirement
  type: Technical
  description: An AI agent operating on behalf of a human VTC member MUST hold a delegation credential
    issued by that member's M-DID, referencing the member's VMC and specifying the agent's permitted capability
    scope as a normative `credentialSubject` claim. Without this, the spec's VMC schema cannot distinguish
    an authorised agent (Aether, M1) from an adversarial one (Phantom, M2). **Source:** DTG Credential
    Spec v0.3 analysis — gap in §5.1 (commentary §2.3, recommendation R1, §10.2).
  guardrails:
  - GR-12
  linked_risks:
  - RK-AI01
  - RK-AI02
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: null
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-53
  name: VIC Role Embedding (membershipRole field)
  type: Technical
  description: 'The VIC `credentialSubject` SHOULD include a `membershipRole` field specifying the role
    to be granted upon admission (e.g. ''trustAnchor'', ''member''). This allows the issuer to cryptographically
    commit to the intended role at invitation time, enabling offline verification and making the VIC tamper-evident
    with respect to role assignment — independent of trust registry availability. The spec''s open question
    (''Q: Should any of this be embedded in the VIC?'') in §6.1 should be resolved in this direction.
    **Source:** DTG Credential Spec v0.3 §6.1 open question (commentary recommendation R4, §2.6).'
  guardrails:
  - GR-01
  linked_risks:
  - RK-G01
  - RK-SC02
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: null
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-54
  name: VWC Requirement for High-Stakes Anchor Admission
  type: Technical
  description: For Phase 2 trust anchor admission, VTC governance SHOULD require that VRCs used in anchor
    admission packages be accompanied by a Witness Credential (VWC per spec §7.3) from a trusted third
    party attesting to the in-person or verified out-of-band nature of the relationship. This directly
    implements CT-36 (Out-of-Band Verification) using the VWC schema and raises the cost of AI-generated
    synthetic anchor persona attacks (RK-AI04). The VWC `witnessContext.method` field should record the
    verification method. **Source:** DTG Credential Spec v0.3 §7.3 (commentary §1.4, recommendation R9).
  guardrails:
  - GR-14
  linked_risks:
  - RK-AI04
  - RK-ID01
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: null
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-55
  name: VEC Issuer Co-Membership Requirement
  type: Governance
  description: VTC implementations SHOULD require that Endorsement Credential (VEC per spec §7.2) issuers
    hold a valid VMC from the same C-DID as the endorsed party. VTA policy enforcement points SHOULD verify
    this co-membership before treating VEC-based reputation signals as valid inputs to admission or governance
    decisions. Aggregated VEC metrics SHOULD be treated with appropriate scepticism where endorsements
    form tight clusters from a small issuer group. **Source:** DTG Credential Spec v0.3 §7.2 — underspecification
    identified in commentary §2.8, recommendation R10.
  guardrails:
  - GR-03
  linked_risks:
  - RK-CR04
  - RK-SY02
  standards_relevance: Medium
  standards_status: unassigned
  normative_language: null
  rationale: null
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-56
  name: VTC Governance Conformance Class
  type: Governance
  description: 'A VTC claiming DTG credential specification compliance MUST publish a version-controlled
    governance framework satisfying the requirements of the DTG VTC Governance Specification (forthcoming).
    At minimum this must include: a genesis policy record (GR-01), a time-bounded initiator authority
    mechanism (GR-02), and a trust anchor diversity policy (GR-03). The trust registry entry for a DTG-compliant
    VTC SHOULD include a resolvable reference to its published governance framework. Without this, technical
    credential compliance provides false assurance to relying parties. **Source:** DTG Credential Spec
    v0.3 §9 (Trust Registries) — gap identified in commentary §2.9, recommendation R8.'
  guardrails:
  - GR-01
  linked_risks:
  - RK-G05
  - RK-G01
  - RK-G02
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: null
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-57
  name: Supported Decision-Making Credential Extension
  type: Technical
  description: Extend the VRC and VMC schema with an optional co-signatory field that distinguishes supported
    consent (co-signatory assists but member retains decision authority) from substituted consent (attorney
    acts in place of member). The distinction must be cryptographically attestable and auditable separately
    from the core credential.
  guardrails:
  - GR-19
  linked_risks:
  - RK-HX04
  - RK-ID06
  - RK-SC05
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: Required to represent legally recognised supported decision-making without creating impersonation-equivalent
    workarounds.
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-58
  name: Accessible Trust Task Ceremony UX for Cognitive Differences
  type: UX
  description: 'Trust task ceremony implementations must offer accessibility profiles adapted for users
    with executive function differences (autism spectrum, ADHD, acquired cognitive impairment). Profiles
    must be negotiable between parties without disclosing the reason for the adaptation request. Minimum
    requirements: simplified QR code flows, extended session timeouts, plain-language guidance, and support
    for a co-present third party during the ceremony.'
  guardrails:
  - GR-19
  linked_risks:
  - RK-HX04
  - RK-NM01
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: Directly addresses ceremony completion failure for EC1 and similar users; linked to EPIC-18.
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-59
  name: LPA Delegation Credential Type
  type: Technical
  description: 'Define a new credential type — the Legal Delegation Credential (LDC) — that represents
    a registered legal authority (Lasting Power of Attorney, court-appointed deputyship, or equivalent)
    as a scope-limited delegation relationship. The LDC must: name the attorney and donor DIDs; reference
    the legal instrument by registration number; constrain the attorney''s authorised operations; and
    be registered in the VTC trust registry as a discoverable relationship distinct from ordinary member
    credentials.'
  guardrails:
  - GR-08
  - GR-19
  linked_risks:
  - RK-HX05
  - RK-HX06
  - RK-SC05
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: Required to represent LPA in the architecture; without this, RK-HX05 cannot be mitigated.
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-60
  name: Secondary Notification Recipient Registration
  type: Technical
  description: The VTC trust registry and governance communication systems must support registration of
    one or more secondary notification recipients for a member's credential lifecycle events (revocation
    notices, renewal reminders, appeals deadlines). Where an LDC is registered, the attorney named in
    the LDC must be automatically enrolled as a secondary recipient. Secondary recipient communications
    must be cryptographically authenticated and separate from the primary member account.
  guardrails:
  - GR-08
  - GR-19
  linked_risks:
  - RK-HX05
  - RK-CR01
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: Required for GR-08 revocation due process to function where the primary holder lacks capacity.
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-61
  name: M-DID Closure and Death Notification Pathway
  type: Governance
  description: 'Define a governed lifecycle pathway for M-DID closure upon death or permanent incapacity,
    including: a notification mechanism for the trust graph; a tamper-evident closure record; a portability
    package for the credential history; and an attorney or next-of-kin confirmation workflow. The VTC
    governing body must publish its M-DID closure procedure as part of its governance documentation.'
  guardrails:
  - GR-08
  linked_risks:
  - RK-HX06
  - RK-SC05
  standards_relevance: Medium
  standards_status: unassigned
  normative_language: null
  rationale: Addresses ghost-node accumulation and missing end-of-life credential lifecycle event.
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-62
  name: Age Assurance Compliance Verification Requirement
  type: Technical
  description: 'Any VTC that admits an age-restricted relying party (i.e., a VTC member or relying party
    operating under the Online Safety Act 2023 Part 5 or equivalent) must verify that: (a) the ZKP implementation
    used for age proofs has been independently audited; (b) the IDVP trust registry entry includes an
    age-verification scope claim; and (c) the relying party''s Ofcom-compliant audit record template is
    reviewed by the VTC governing body before the relying party is admitted. The governing body must maintain
    documented evidence of this review.'
  guardrails:
  - GR-20
  linked_risks:
  - RK-EX04
  - RK-EX06
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: Required to establish governing body accountability for child safety outcomes in age-assurance
    use cases.
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-63
  name: Organisational Credential Type Definition
  type: Technical
  description: 'Define a new credential type — the Organisational Member Credential (OMC) — that represents
    an organisation (rather than a natural person) as a VTC participant. The OMC must: identify the organisation
    by legal identifier (company number, charity number, NHS ODS code, etc.); name the individual officers
    responsible for credential operations (with their personal DIDs); specify the internal governance
    process by which the organisation authorises credential actions; and bind the organisation''s regulatory
    compliance status as an attestable claim.'
  guardrails:
  - GR-21
  linked_risks:
  - RK-EX05
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: Without an organisational credential type, the DTG ecosystem cannot accommodate regulated
    institutions; required for NHS and similar use cases.
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-64
  name: Organisational Governance Conformance Mapping
  type: Governance
  description: For organisations seeking VTC membership, the VTC governing body must assess whether the
    organisation's existing internal governance framework (e.g., NHS DSPT, CQC registration, ISO 27001)
    satisfies the VTC governance conformance class (CT-56). Where it does, this equivalence must be formally
    documented and recorded in the trust registry as an attestable claim, avoiding duplication of governance
    processes that would be incompatible with public sector procurement timescales.
  guardrails:
  - GR-21
  linked_risks:
  - RK-EX05
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: Required to make the DTG accessible to regulated organisations without requiring governance
    duplication.
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-65
  name: Cross-Jurisdiction IDVP Standing Verification
  type: Technical
  description: The VTC trust registry must expose a machine-readable, near-real-time IDVP standing endpoint
    that age-restricted relying parties can query at the point of credential presentation. For IDVPs operating
    under non-UK regulatory frameworks, the registry must include a jurisdictional scope claim and a date-of-last-verification.
    Relying parties must not accept IDVCs from IDVPs whose registry standing cannot be confirmed at presentation
    time for age-assurance use cases.
  guardrails:
  - GR-05
  - GR-20
  linked_risks:
  - RK-EX06
  - RK-ID03
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: Required for OSA 2023 compliance by age-restricted relying parties; extends existing IDVP
    registry standing requirement (GR-05).
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
- id: CT-66
  name: Children's Data Processing Impact Assessment Requirement
  type: Legal
  description: Any VTC that knowingly or foreseeably admits participants under the age of 18 (including
    via supported decision-making pathways for minors) must complete a Data Protection Impact Assessment
    (DPIA) addressing children's data processing obligations under UK GDPR Article 35, the ICO Children's
    Code, and the Data (Use and Access) Act 2025. The DPIA must be completed before the first minor is
    admitted and reviewed annually. The VTC governing body must designate a named responsible officer
    for children's data compliance.
  guardrails:
  - GR-06
  - GR-19
  linked_risks:
  - RK-ID06
  - RK-EX03
  standards_relevance: High
  standards_status: unassigned
  normative_language: null
  rationale: Required to ensure VTCs that admit minors meet statutory obligations under the UK children's
    data protection framework.
  provenance:
    source: workbook:RiskRegister_v5.xlsx
    imported: '2026-08-05'
