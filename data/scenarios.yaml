- id: SC-25
  name: Governance Configuration Failure — VTA Applies Wrong Framework Version to Live Ceremony
  description: A deployment error causes a VTA to apply governance framework version 1.1 (the amended
    three-VRC threshold) to a ceremony that was AGREED under version 1.0 (the two-VRC threshold). At Level
    B, the PEP rejects a sub-exchange that was valid under 1.0 but not under 1.1, producing an unexpected
    FAILED terminal state for a ceremony whose parties did nothing wrong. The failure record must capture
    the version mismatch in a machine-readable form. The parties invoke Restore. The Restore task must
    determine whether the failure was a protocol error (PEP applied wrong version), a governance error
    (version effective date was set incorrectly), or an implementation error (VTA deployment bug).
  lifecycle_phase: Governance Configuration / Security
  legitimate_personas:
  - D5
  - D6
  adversarial_personas: []
  governance_decisions: '1. Is governance version binding at ceremony AGREED state a mandatory protocol
    requirement or an implementation recommendation?

    2. What is the data model for a governance version reference in a ceremony profile — must it be a
    content-addressed hash of the governance document?

    3. Does a version mismatch failure produce a distinct terminal state (INVALID/VERSION_MISMATCH) or
    does it collapse to FAILED?

    4. What is the Restore pathway for a ceremony that failed due to a governance configuration error
    — who initiates, who adjudicates, and what is the remediation?

    5. How does the spec prevent a malicious VTA operator from deliberately applying an incorrect governance
    version to deny a ceremony to targeted members?'
