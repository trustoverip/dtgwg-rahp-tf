- id: SC-24
  name: VTC Dissolution — Winding Down with Full Member Portability
  description: 'Daniel''s VTC passes a governance vote to dissolve. The dissolution protocol requires:
    (1) all members notified within 24 hours via Signal; (2) all VMCs revoked via Lifecycle Transition;
    (3) the Community DID deactivated; (4) the tamper-evident governance ledger preserved and transferred
    to a designated archive; (5) each member issued a portability package containing their VMC (with dissolution
    record attached), all outcome records from ceremonies they participated in, all VWCs and endorsements,
    and the signed dissolution record; (6) a historical legitimacy binding — a signed assertion that all
    credentials issued before the dissolution date were valid at issuance — so other VTCs can verify the
    historical record.'
  lifecycle_phase: VTC Lifecycle / Dissolution
